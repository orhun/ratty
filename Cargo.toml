[package]
name = "ratty"
version = "0.5.0"
description = "A GPU-rendered terminal emulator that supports inline 3D graphics"
authors = ["Orhun Parmaksız <orhunparmaksiz@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/orhun/ratty"
repository = "https://github.com/orhun/ratty"
keywords = ["terminal", "emulator", "3d", "graphics"]
categories = ["command-line-utilities", "graphics"]
edition = "2024"
default-run = "ratty"
exclude = ["website/**", ".github/**", "widget/**"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = "0.22"
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
    "gltf_animation",
    "keyboard",
    "mouse",
    "touch",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "tonemapping_luts",
    "wayland",
    "x11",
    "zstd_rust",
] }
clap = { version = "4.5", features = ["derive"] }
etcetera = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
parley_ratatui = "0.3.4"
portable-pty = "0.8"
ratatui = "0.30"
rio-vt = { version = "0.5.19", default-features = false }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
stl_io = "0.11.0"
tobj = "4.0"
toml = "0.8"
winit = { version = "0.30", default-features = false }

# MCP control-plane binary. The GUI-side bridge itself remains synchronous so
# it never adds an async runtime to Bevy's render process.
getrandom = "0.3"
rmcp = { version = "3.2", features = ["transport-io"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[[bin]]
name = "ratty-mcp"
path = "src/bin/ratty-mcp.rs"

[build-dependencies]
winresource = "0.1.31"

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"
