[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.dist]
dist = false

[features]
app = ["dep:ratty", "dep:bevy_math", "dep:crossterm", "dep:bevy_terminal_ratatui"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ratty-vt = { path = "../crates/ratty-vt" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratty = { path = "..", features = ["performance"], optional = true }
bevy_math = { version = "0.19", optional = true }
crossterm = { version = "0.29", optional = true }
bevy_terminal_ratatui = { version = "0.7.3", default-features = false, features = ["system_fonts"], optional = true }
