name: Install Linux system dependencies
description: Installs the apt packages every Linux build job needs.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libasound2-dev \
          libfontconfig1-dev \
          libudev-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev
