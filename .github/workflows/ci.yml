name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --manifest-path ${{ matrix.manifest }} -- --check

  check:
    name: Check (${{ matrix.label }}, ${{ matrix.manifest }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
        include:
          - target: aarch64-apple-darwin
            label: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            label: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            label: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            label: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            label: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace --locked --manifest-path ${{ matrix.manifest }} --target ${{ matrix.target }}

  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run workspace tests and doctests
        run: cargo test --workspace --all-features --locked
      - name: Test the application without optional features
        run: cargo test -p ratty --locked
      - name: Exercise benchmark harness (no timing threshold)
        run: cargo run --locked -p xtask -- bench-vt --filter ascii/80x24/chunk-4096 --samples 1 --rounds 1 --output "$RUNNER_TEMP/vt-bench.json"
      - name: Exercise CPU drawing and PTY harness (no timing threshold)
        run: cargo run --locked -p xtask --features app -- bench-app --samples 1 --frames 8 --lines 3000 --output "$RUNNER_TEMP/app-bench.json"
      - name: Exercise burst input and terminal reply validation
        run: cargo run --locked -p xtask --features app -- bench-interactive --samples 1 --bursts 4 --burst-lines 32 --output "$RUNNER_TEMP/interactive-bench.json"
      - name: Exercise sustained output acknowledgement validation
        run: cargo run --locked -p xtask --features app -- bench-flood --samples 1 --bursts 2 --lines 128 --output "$RUNNER_TEMP/flood-bench.json"

  package:
    name: Package workspace crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Verify package
        run: cargo package --workspace --exclude xtask --locked

  gpu-smoke:
    name: Headless renderer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # Share dependency artifacts between Ratty and the widget examples.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      WGPU_BACKEND: vulkan
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install software Vulkan and test fonts
        run: |
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-tools fonts-dejavu-core
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          printf 'VK_DRIVER_FILES=%s\n' "${drivers[0]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          printf 'XDG_RUNTIME_DIR=%s\n' "$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Verify software Vulkan availability
        run: vulkaninfo --summary
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build capture and widget examples
        run: |
          cargo build --locked --example headless_snapshot
          cargo build --manifest-path widget/Cargo.toml --locked --example document --example render_test
      - name: Capture and validate renderer smoke cases
        timeout-minutes: 15
        run: cargo run --locked -p xtask -- smoke --output "$RUNNER_TEMP/headless-smoke"
      - name: Upload captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-renderer-smoke
          path: ${{ runner.temp }}/headless-smoke
          retention-days: 7

  clippy:
    name: Clippy (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - widget/Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --manifest-path ${{ matrix.manifest }} -- -D warnings
