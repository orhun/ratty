[package]
name = "ratty-vt"
version = "0.1.1"
description = "Terminal parser and screen state for Ratty, forked from vt100"
authors = ["Jesse Luehrs", "Orhun Parmaksız <orhunparmaksiz@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/orhun/ratty"
repository = "https://github.com/orhun/ratty"
keywords = ["terminal", "vt100", "ansi", "parser"]
categories = ["command-line-interface", "parsing"]
edition = "2024"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
compact_str = "0.9"
itoa = "1.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
ratty-vte = { version = "0.1.0", path = "../ratty-vte" }

[dev-dependencies]
quickcheck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
